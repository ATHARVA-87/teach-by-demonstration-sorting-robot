[mypy]
python_version = 3.14
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
explicit_package_bases = True
exclude = (/build/|/install/|/log/|/test/|setup\.py$|/launch/)

# ROS 2 and some C-extension packages ship without type stubs.
[mypy-rclpy.*,sorting_interfaces.*,sensor_msgs.*,std_msgs.*,geometry_msgs.*,builtin_interfaces.*,rcl_interfaces.*,std_srvs.*,ament_index_python.*,launch.*,launch_ros.*,mediapipe.*,cv2.*,mujoco.*,uvicorn.*,tf2_ros.*,moveit.*,moveit_configs_utils.*,control_msgs.*,rosgraph_msgs.*,trajectory_msgs.*,moveit_msgs.*,shape_msgs.*,action_msgs.*]
ignore_missing_imports = True
